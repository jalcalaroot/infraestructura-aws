AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC-Enterprise-3AZ-Hardened-Final-Version'

Parameters:
  ClassA: { Type: Number, Default: 10 }
  ClassB: { Type: Number, Default: 0 }
  ProjectName: { Type: String, Description: "Nombre del Proyecto" }
  Environment: { Type: String, AllowedValues: [dev, stg, prod], Default: dev }
  Owner: { Type: String, Description: "Responsable del recurso" }
  CostCenter: { Type: String, Description: "Centro de costos" }

Resources:
  # --- 1. CORE NETWORKING ---
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Sub '${ClassA}.${ClassB}.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPC' }]

  # Auditoría de tráfico (Flow Logs)

  KMSLogsKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: !Sub 'Key for VPC Flow Logs - ${ProjectName}'
      EnableKeyRotation: true # ¡Best Practice de seguridad!
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAdmin
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowLogs
            Effect: Allow
            Principal: { Service: !Sub 'logs.${AWS::Region}.amazonaws.com' }
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'

  FlowLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName: !Sub '/aws/vpc/${ProjectName}-${Environment}-flowlogs'
      RetentionInDays: 7
      KmsKeyId: !GetAtt KMSLogsKey.Arn

  FlowLogRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flowlogs-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogGroups', 'logs:DescribeLogStreams']
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/flowlogs/${ProjectName}-*:*'

  VPCFlowLog:
    Type: 'AWS::EC2::FlowLog'
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogGroupName: !Ref FlowLogGroup
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL

  # Salida a Internet
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-IGW' }]

  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties: { VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway }

  EIP:
    Type: 'AWS::EC2::EIP'
    Properties: { Domain: vpc, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-NAT-EIP' }] }

  RegionalNATGateway:
    Type: 'AWS::EC2::NatGateway'
    DependsOn: VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      ConnectivityType: public
      AvailabilityMode: regional
      AllocationId: !GetAtt EIP.AllocationId
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-RNAT' }]

  # --- 2. SUBNETS (3 AZs) ---
  SubnetAPublic: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [0, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.0.0/22', MapPublicIpOnLaunch: true, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-PUB-A' }] } }
  SubnetBPublic: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [1, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.4.0/22', MapPublicIpOnLaunch: true, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-PUB-B' }] } }
  SubnetCPublic: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [2, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.8.0/22', MapPublicIpOnLaunch: true, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-PUB-C' }] } }

  SubnetAPrivate: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [0, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.16.0/20', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-PRIV-A' }] } }
  SubnetBPrivate: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [1, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.32.0/20', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-PRIV-B' }] } }
  SubnetCPrivate: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [2, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.48.0/20', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-PRIV-C' }] } }

  SubnetAIntra: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [0, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.64.0/20', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-INTRA-A' }] } }
  SubnetBIntra: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [1, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.80.0/20', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-INTRA-B' }] } }
  SubnetCIntra: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [2, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.96.0/20', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-INTRA-C' }] } }

  SubnetATgw: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [0, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.112.0/24', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-TGW-A' }] } }
  SubnetBTgw: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [1, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.113.0/24', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-TGW-B' }] } }
  SubnetCTgw: { Type: 'AWS::EC2::Subnet', Properties: { VpcId: !Ref VPC, AvailabilityZone: !Select [2, !GetAZs ''], CidrBlock: !Sub '${ClassA}.${ClassB}.114.0/24', Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-SUB-TGW-C' }] } }

# --- 3. ROUTE TABLES ---
  RTPublic: { Type: 'AWS::EC2::RouteTable', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-RT-PUB' }] } }
  RTPrivate: { Type: 'AWS::EC2::RouteTable', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-RT-PRIV' }] } }
  RTIntra: { Type: 'AWS::EC2::RouteTable', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-RT-INTRA' }] } }
  RouteTransit: { Type: 'AWS::EC2::RouteTable', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-RT-TGW' }] } }

  # RUTA PÚBLICA (Espera al Attachment del IGW)
  RoutePub:
    Type: 'AWS::EC2::Route'
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RTPublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # RUTA PRIVADA (Espera a que el NAT Gateway esté LISTO)
  RoutePriv:
    Type: 'AWS::EC2::Route'
    DependsOn: RegionalNATGateway
    Properties:
      RouteTableId: !Ref RTPrivate
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RegionalNATGateway


  # Asociaciones de Subredes a Tablas de Ruta
  AssocPubA: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetAPublic, RouteTableId: !Ref RTPublic } }
  AssocPubB: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetBPublic, RouteTableId: !Ref RTPublic } }
  AssocPubC: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetCPublic, RouteTableId: !Ref RTPublic } }
  AssocPrivA: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetAPrivate, RouteTableId: !Ref RTPrivate } }
  AssocPrivB: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetBPrivate, RouteTableId: !Ref RTPrivate } }
  AssocPrivC: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetCPrivate, RouteTableId: !Ref RTPrivate } }
  AssocIntraA: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetAIntra, RouteTableId: !Ref RTIntra } }
  AssocIntraB: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetBIntra, RouteTableId: !Ref RTIntra } }
  AssocIntraC: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetCIntra, RouteTableId: !Ref RTIntra } }
  AssocTgwA: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetATgw, RouteTableId: !Ref RouteTransit } }
  AssocTgwB: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetBTgw, RouteTableId: !Ref RouteTransit } }
  AssocTgwC: { Type: 'AWS::EC2::SubnetRouteTableAssociation', Properties: { SubnetId: !Ref SubnetCTgw, RouteTableId: !Ref RouteTransit } }

# --- 4. ENDPOINTS (Gateway y Interface) ---
  EndpointSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: "Shared SG for VPC Endpoints"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Sub '${ClassA}.${ClassB}.0.0/16'
          Description: "Allow HTTPS traffic from VPC CIDR to Endpoints"
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-SG-ENDPOINTS'

  # Gateways (Asociados a Tablas de Ruta)
  S3Endpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      VpcId: !Ref VPC
      RouteTableIds: [!Ref RTPublic, !Ref RTPrivate, !Ref RTIntra]
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-VPCE-S3'

  DynamoEndpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      VpcId: !Ref VPC
      RouteTableIds: [!Ref RTPublic, !Ref RTPrivate, !Ref RTIntra]
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-VPCE-DYNAMO'

  # Interfaces (Asociados a Subredes Privadas para HA)
  EC2Endpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-EC2' }] } }
  SSMEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-SSM' }] } }
  SSMMessagesEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-SSMMESSAGES' }] } }
  EC2MessagesEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-EC2MESSAGES' }] } }
  KMSEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-KMS' }] } }
  LogsEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-LOGS' }] } }
  SecretsEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-SECRETS' }] } }
  ECREndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-ECR' }] } }
  ECRApiEndpoint: { Type: 'AWS::EC2::VPCEndpoint', Properties: { ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api', VpcEndpointType: Interface, PrivateDnsEnabled: true, SubnetIds: [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate], SecurityGroupIds: [!Ref EndpointSG], VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-VPCE-ECR-API' }] } }

# --- 5. NETWORK ACLS (Corrección de duplicados y Tráfico Libre) ---
  NaclPublic: { Type: 'AWS::EC2::NetworkAcl', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-NACL-PUB' }] } }
  NaclPrivate: { Type: 'AWS::EC2::NetworkAcl', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-NACL-PRIV' }] } }
  NaclInternal: { Type: 'AWS::EC2::NetworkAcl', Properties: { VpcId: !Ref VPC, Tags: [{ Key: Name, Value: !Sub '${ProjectName}-${Environment}-NACL-INTERNAL' }] } }

  # PÚBLICA: Reglas específicas de entrada (100+) / Salida libre (200+)
  InPubHTTP: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclPublic, RuleNumber: 100, Protocol: 6, PortRange: { From: 80, To: 80 }, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: false } }
  InPubHTTPS: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclPublic, RuleNumber: 110, Protocol: 6, PortRange: { From: 443, To: 443 }, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: false } }
  InPubEph: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclPublic, RuleNumber: 140, Protocol: 6, PortRange: { From: 1024, To: 65535 }, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: false } }
  OutPubFree: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclPublic, RuleNumber: 200, Protocol: -1, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: true } }

  # PRIVADA: Entrada libre (100) / Salida libre (200)
  InPrivFree: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclPrivate, RuleNumber: 100, Protocol: -1, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: false } }
  OutPrivFree: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclPrivate, RuleNumber: 200, Protocol: -1, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: true } }

  # INTERNAL: Entrada libre (100) / Salida libre (200)
  InIntFree: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclInternal, RuleNumber: 100, Protocol: -1, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: false } }
  OutIntFree: { Type: 'AWS::EC2::NetworkAclEntry', Properties: { NetworkAclId: !Ref NaclInternal, RuleNumber: 200, Protocol: -1, CidrBlock: 0.0.0.0/0, RuleAction: allow, Egress: true } }

  # Asociaciones NACL
  AssocNaclPubA: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetAPublic, NetworkAclId: !Ref NaclPublic } }
  AssocNaclPubB: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetBPublic, NetworkAclId: !Ref NaclPublic } }
  AssocNaclPubC: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetCPublic, NetworkAclId: !Ref NaclPublic } }
  AssocNaclPrivA: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetAPrivate, NetworkAclId: !Ref NaclPrivate } }
  AssocNaclPrivB: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetBPrivate, NetworkAclId: !Ref NaclPrivate } }
  AssocNaclPrivC: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetCPrivate, NetworkAclId: !Ref NaclPrivate } }
  AssocNaclIntraA: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetAIntra, NetworkAclId: !Ref NaclInternal } }
  AssocNaclIntraB: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetBIntra, NetworkAclId: !Ref NaclInternal } }
  AssocNaclIntraC: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetCIntra, NetworkAclId: !Ref NaclInternal } }
  AssocNaclTgwA: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetATgw, NetworkAclId: !Ref NaclInternal } }
  AssocNaclTgwB: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetBTgw, NetworkAclId: !Ref NaclInternal } }
  AssocNaclTgwC: { Type: 'AWS::EC2::SubnetNetworkAclAssociation', Properties: { SubnetId: !Ref SubnetCTgw, NetworkAclId: !Ref NaclInternal } }

# --- 6. OUTPUTS ---
Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub "${ProjectName}-${Environment}-VPC-ID"

  VpcCidr:
    Value: !GetAtt VPC.CidrBlock
    Export:
      Name: !Sub "${ProjectName}-${Environment}-VPC-CIDR"

  # Subredes Públicas (Lista)
  SubnetsPublic:
    Value: !Join [",", [!Ref SubnetAPublic, !Ref SubnetBPublic, !Ref SubnetCPublic]]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-SUBNETS-PUB"

  # Subredes Privadas (Lista) - LA QUE BUSCA EL BASTION
  SubnetsPrivate:
    Value: !Join [",", [!Ref SubnetAPrivate, !Ref SubnetBPrivate, !Ref SubnetCPrivate]]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-SUBNETS-PRIV"

  # Subredes Intra (Lista)
  SubnetsIntra:
    Value: !Join [",", [!Ref SubnetAIntra, !Ref SubnetBIntra, !Ref SubnetCIntra]]
    Export:
      Name: !Sub "${ProjectName}-${Environment}-SUBNETS-INTRA"

  # Seguridad y Rutas
  EndpointSGId:
    Value: !Ref EndpointSG
    Export:
      Name: !Sub "${ProjectName}-${Environment}-SG-ENDPOINTS-ID"

  RTIntraId:
    Value: !Ref RTIntra
    Export:
      Name: !Sub "${ProjectName}-${Environment}-RT-INTRA-ID"