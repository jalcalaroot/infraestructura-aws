name: Main CloudFormation Engine

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      stack_name:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "us-east-1"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::924612596837:role/github-actions-role
          role-session-name: github-actions-cfn-deploy
          aws-region: ${{ inputs.aws_region }}

      # ... (Pasos de inspección de stack y validación) ...

      - name: Create and Execute Change Set
        run: |
          CS_NAME="cs-${{ github.run_id }}"
          # Usamos los nombres estandarizados dentro de la carpeta del servicio
          aws cloudformation create-change-set \
            --stack-name ${{ inputs.stack_name }} \
            --change-set-name $CS_NAME \
            --change-set-type ${{ steps.check_stack.outputs.type }} \
            --template-body file://${{ inputs.service_name }}/template.yaml \
            --parameters file://${{ inputs.service_name }}/parameters.json \
            --capabilities CAPABILITY_NAMED_IAM
          
          # ... (Resto de la lógica de ejecución) ...
