name: Deploy VPC

on:
  push:
    branches: ["main"]
    paths:
      - 'vpc/**'
  workflow_dispatch:

jobs:
  vpc-deployment:
    # Nota el cambio a main.yml aquí
    uses: ./.github/workflows/main.yml
    with:
      stack_name: "vpc-multilayers"
      # Como decidimos estandarizar los nombres de archivos:
      service_name: "vpc" 
      aws_region: "us-east-1"
