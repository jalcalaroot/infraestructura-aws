name: Deploy VPC

on:
  push:
    branches: 
      - "main"
      - "dev"
      - "stg"
    paths:
      - 'vpc/**'
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde la web en cualquier rama

permissions:
  id-token: write
  contents: read

jobs:
  vpc-deployment:
    uses: ./.github/workflows/main.yml
    with:
      service_name: "vpc-multilayers-${{ github.ref_name }}"
      stack_name: "vpc"
      aws_region: "us-east-1"
