name: Deploy VPC

on:
  push:
    branches: ["main"]
    paths:
      - 'vpc/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  vpc-deployment:
    uses: ./.github/workflows/main.yml
    with:
      service_name: "vpc"
      stack_name: "vpc"
      aws_region: "us-east-1"
